name: Build and Update Latest Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'[web:36][attached_file:1]

    - name: Clone HsMod bepinex5 branch
      run: |
        git clone --depth 1 --branch bepinex5 https://github.com/Pik-4/HsMod HsMod-temp[attached_file:1]

    - name: Build HsMod Release
      run: |
        cd HsMod-temp
        dotnet build --configuration Release --no-restore[attached_file:1]

    - name: Get latest release
      id: latest_release
      uses: Insonmnia/gh-release-fetch@v1.5.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}[web:50]

    - name: Update or create latest release
      if: steps.latest_release.outputs.tag_name == ''
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: latest
        release_name: Latest HsMod Build
        draft: false
        prerelease: false[web:35]

    - name: Upload HsMod.dll to latest release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.latest_release.outputs.upload_url || fromJson(github.event.inputs.create_release || '{}').upload_url }}
        asset_path: ./HsMod/Release/HsMod.dll
        asset_name: HsMod.dll
        asset_content_type: application/octet-stream[web:30][web:42][attached_file:1]
