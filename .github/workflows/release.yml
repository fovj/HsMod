name: Build and Release HsMod

on:
  push:
    branches: [ bepinex5 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Clone HsMod bepinex5 branch
      run: |
        git clone --depth 1 --branch bepinex5 https://github.com/Pik-4/HsMod.git
        cd HsMod

    - name: Build HsMod
      run: |
        cd HsMod
        dotnet build --configuration Release --no-restore

    - name: Generate tag name
      id: tag
      run: echo "tag=HsMod-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: HsMod Build ${{ steps.tag.outputs.tag }}
        body: |
          Automated build from commit ${{ github.sha }}.
          Built on ${{ github.event.head_commit.timestamp }}.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload HsMod.dll
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./HsMod/Release/HsMod.dll
        asset_name: HsMod.dll
        asset_content_type: application/octet-stream
